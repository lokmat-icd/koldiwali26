<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lokmat - Advertisement Dashboard</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #e6edf3; min-height: 100vh; }
  .container-fluid { max-width: 1400px; margin: 0 auto; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #161b22; border-radius: 3px; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #58a6ff; }

  #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  #loginOverlay .login-box { background: #161b22; padding: 45px 50px 50px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.7); max-width: 420px; width: 100%; border: 1px solid #30363d; }
  #loginOverlay .login-box .logo { text-align: center; margin-bottom: 25px; }
  #loginOverlay .login-box .logo img { width: 60%; height: auto; max-height: 80px; object-fit: contain; border-radius: 12px; display: block; margin: 0 auto; }
  #loginOverlay .login-box .logo h3 { color: #58a6ff; margin-top: 15px; margin-bottom: 5px; font-weight: 600; font-size: 20px; }
  #loginOverlay .login-box .logo p.sub { color: #8b949e; font-size: 13px; margin: 0; }
  #loginOverlay .login-box .form-group { margin-bottom: 18px; }
  #loginOverlay .login-box .form-group label { font-weight: 600; font-size: 13px; color: #8b949e; display: block; margin-bottom: 5px; }
  #loginOverlay .login-box .form-group input { border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; padding: 10px 14px; font-size: 14px; width: 100%; transition: all 0.3s; }
  #loginOverlay .login-box .form-group input:focus { outline: none; border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2); }
  #loginOverlay .login-box .login-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #238636; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; margin-top: 5px; }
  #loginOverlay .login-box .login-btn:hover { background: #2ea043; transform: translateY(-2px); }
  #loginOverlay .login-box .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  #loginOverlay .login-box .login-error { color: #f85149; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
  #loginOverlay .login-box .login-error.show { display: block; }

  .header { background: #161b22; color: #e6edf3; padding: 12px 22px; border-radius: 12px; margin-bottom: 0; border: 1px solid #30363d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .header-row1 { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 15px; min-height: 48px; }
  .header-left { display: flex; align-items: center; flex-shrink: 0; }
  .header-logo { width: 150px; height: auto; max-height: 60px; object-fit: contain; display: block; border-radius: 18px; }
  .header-stats { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; flex: 1; justify-content: center; }
  .header-stats .stat-chip { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.05); padding: 3px 14px 3px 10px; border-radius: 18px; font-size: 12px; font-weight: 500; border: 1px solid rgba(255,255,255,0.06); color: #e6edf3; }
  .header-stats .stat-chip .stat-label { opacity: 0.7; font-weight: 400; font-size: 11px; color: #8b949e; }
  .header-stats .stat-chip .stat-value { font-weight: 700; font-size: 14px; color: #58a6ff; }
  .header-stats .stat-divider { color: #30363d; font-size: 14px; font-weight: 100; }

  .header-user { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); padding: 4px 12px 4px 16px; border-radius: 30px; flex-shrink: 0; border: 1px solid #30363d; }
  .header-user .user-name { font-size: 13px; font-weight: 500; color: #e6edf3; }
  .header-user .user-role { font-size: 10px; opacity: 0.6; color: #8b949e; }
  .header-user .logout-header-btn { background: rgba(255,255,255,0.06); border: none; color: #8b949e; padding: 3px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
  .header-user .logout-header-btn:hover { background: rgba(255,255,255,0.12); color: #e6edf3; }

  .tabs-container { background: #161b22; border-radius: 10px 10px 0 0; border: 1px solid #30363d; border-bottom: none; overflow: hidden; margin-top: 0; }
  .tabs { display: flex; border-bottom: 2px solid #30363d; background: #0d1117; flex-wrap: wrap; }
  .tab-btn { padding: 12px 28px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: #8b949e; cursor: pointer; transition: all 0.3s; position: relative; border-bottom: 3px solid transparent; }
  .tab-btn:hover { color: #58a6ff; background: rgba(88, 166, 255, 0.06); }
  .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; background: #161b22; }
  .tab-btn i { margin-right: 8px; }
  .tab-content { display: none; padding: 20px; background: #161b22; border: 1px solid #30363d; border-top: none; border-radius: 0 0 10px 10px; }
  .tab-content.active { display: block; }

  .filters-section { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 16px; background: #0d1117; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 16px; position: relative; }
  .filter-group { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
  .filter-group label { font-weight: 600; font-size: 10px; color: #8b949e; margin: 0; white-space: nowrap; }
  .filter-group select { padding: 3px 6px; border-radius: 4px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 11px; min-width: 80px; max-width: 130px; height: 28px; }
  .filter-group select:focus { outline: none; border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2); }
  .filter-group select option { background: #161b22; color: #e6edf3; }
  .filter-group select[disabled] { background: #161b22; color: #58a6ff; opacity: 1; cursor: default; font-weight: 600; }
  .filter-group .gear-btn { background: rgba(88, 166, 255, 0.12); border: 1px solid #30363d; color: #58a6ff; width: 26px; height: 28px; border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .filter-group .gear-btn:hover { background: rgba(88, 166, 255, 0.25); }
  .fab-container { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .fab-btn { width: 38px; height: 38px; border-radius: 50%; background: #238636; color: white; border: none; font-size: 20px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4); }
  .fab-btn:hover { background: #2ea043; transform: scale(1.1) rotate(90deg); }

  .stats-bar { background: #0d1117; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 16px; overflow: hidden; }
  .stats-bar .stats-row { display: flex; flex-wrap: wrap; align-items: center; padding: 8px 18px; gap: 6px 16px; }
  .stats-bar .stats-row.stats-main { background: #0d1117; border-bottom: 1px solid #30363d; }
  .stats-bar .stat-item { font-size: 13px; color: #8b949e; white-space: nowrap; }
  .stats-bar .stat-item strong { color: #58a6ff; font-size: 15px; }
  .stats-bar .stat-divider { color: #30363d; font-size: 16px; font-weight: 100; }

  .ads-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 16px; padding: 0; }
  .ad-card { background: #161b22; border-radius: 10px; overflow: hidden; transition: all 0.3s ease; border: 1px solid #30363d; display: flex; flex-direction: column; border-left-width: 5px; }
  .ad-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.6); transform: translateY(-3px); border-color: #58a6ff; }
  .card-header { padding: 10px 14px 8px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; background: #0d1117; }
  .card-header .file-name { font-size: 15px; font-weight: 600; color: #58a6ff; }
  .card-header .badge-group { display: flex; gap: 4px; flex-wrap: wrap; }
  .card-header .desk-badge { font-size: 9px; padding: 2px 8px; border-radius: 20px; font-weight: 600; background: #1a3a6b; color: white; }
  .card-header .icd-badge { font-size: 9px; padding: 2px 8px; border-radius: 20px; font-weight: 600; background: #c79306; color: white; }
  .card-header .region-badge { font-size: 9px; padding: 2px 8px; border-radius: 20px; font-weight: 600; background: #6f42c1; color: white; }
  .card-body { padding: 8px 14px 10px; flex: 1; }
  .card-body .row { display: flex; flex-wrap: wrap; margin-bottom: 1px; line-height: 1.4; }
  .card-body .row .col { display: flex; align-items: baseline; flex: 1; min-width: 45%; padding: 1px 4px 1px 0; }
  .card-body .label { font-size: 9.5pt; font-weight: 600; color: #8b949e; min-width: 60px; flex-shrink: 0; }
  .card-body .value { font-size: 9.2pt; color: #e6edf3; word-break: break-word; }
  .card-body .value.highlight { color: #58a6ff; font-weight: 600; }
  .card-actions { padding: 8px 14px 10px; border-top: 1px solid #30363d; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; background: #0d1117; }
  .card-actions .btn-action { padding: 4px 16px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .card-actions .btn-edit { background: #238636; color: white; }
  .card-actions .btn-edit:hover { background: #2ea043; }

  .no-results { text-align: center; padding: 40px 20px; color: #8b949e; background: #161b22; border-radius: 12px; grid-column: 1 / -1; border: 1px solid #30363d; }
  .no-results i { font-size: 36px; opacity: 0.3; display: block; margin-bottom: 12px; }
  .loading-spinner { text-align: center; padding: 50px 20px; color: #8b949e; grid-column: 1 / -1; }
  .loading-spinner i { font-size: 28px; margin-bottom: 10px; display: block; color: #58a6ff; }

  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-overlay.show { display: flex; }
  .modal-overlay .modal-box { background: #161b22; border-radius: 12px; max-width: 1100px; width: 95%; max-height: 92vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.8); animation: modalSlideIn 0.3s ease; border: 1px solid #30363d; }
  @keyframes modalSlideIn { from { transform: translateY(-30px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  .modal-overlay .modal-header { padding: 16px 24px; background: linear-gradient(135deg, #0d1117 0%, #1a3a6b 100%); color: white; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1; border-bottom: 1px solid #30363d; }
  .modal-overlay .modal-header h4 { margin: 0; font-weight: 600; font-size: 18px; color: #58a6ff; }
  .modal-overlay .modal-header h4 i { margin-right: 10px; }
  .modal-overlay .modal-header .close-btn { background: rgba(255,255,255,0.08); border: 1px solid #30363d; color: #8b949e; width: 34px; height: 34px; border-radius: 50%; font-size: 20px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; }
  .modal-overlay .modal-header .close-btn:hover { background: rgba(255,255,255,0.15); color: #e6edf3; transform: rotate(90deg); border-color: #58a6ff; }
  .modal-overlay .modal-body { padding: 24px 28px; color: #e6edf3; background: #0d1117; }
  .modal-overlay .modal-footer { padding: 12px 24px 20px; display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #30363d; background: #0d1117; border-radius: 0 0 12px 12px; }
  .modal-overlay .modal-footer .btn { padding: 8px 28px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s; border: none; }
  .modal-overlay .modal-footer .btn-cancel { background: #21262d; color: #8b949e; }
  .modal-overlay .modal-footer .btn-cancel:hover { background: #30363d; color: #e6edf3; }
  .modal-overlay .modal-footer .btn-save { background: #238636; color: white; }
  .modal-overlay .modal-footer .btn-save:hover { background: #2ea043; }
  .modal-overlay .modal-footer .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

  .modal-overlay input, .modal-overlay select { background: #0d1117 !important; color: #e6edf3 !important; border: 1px solid #30363d !important; border-radius: 6px !important; padding: 8px 12px !important; font-size: 13px !important; width: 100% !important; height: auto !important; }
  .modal-overlay input:focus, .modal-overlay select:focus { border-color: #58a6ff !important; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15) !important; outline: none !important; }
  .modal-overlay input:disabled, .modal-overlay select:disabled { background: #161b22 !important; color: #484f58 !important; cursor: not-allowed !important; opacity: 0.7 !important; }
  .modal-overlay .calculated-field { background: #161b22 !important; color: #58a6ff !important; font-weight: 600 !important; }

  .flatpickr-calendar { background: #161b22 !important; border: 1px solid #30363d !important; }
  .flatpickr-calendar .flatpickr-months { background: #0d1117 !important; }
  .flatpickr-calendar .flatpickr-months .flatpickr-month { color: #e6edf3 !important; }
  .flatpickr-calendar .flatpickr-weekday { color: #8b949e !important; }
  .flatpickr-calendar .flatpickr-day { color: #e6edf3 !important; border-color: #30363d !important; }
  .flatpickr-calendar .flatpickr-day:hover { background: #30363d !important; border-color: #58a6ff !important; }
  .flatpickr-calendar .flatpickr-day.selected { background: #238636 !important; border-color: #238636 !important; }
  .flatpickr-calendar .flatpickr-day.today { border-color: #58a6ff !important; }

  .ad-edit-form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px 20px; }
  .ad-edit-form .form-group { display: flex; flex-direction: column; gap: 4px; }
  .ad-edit-form .form-group label { font-size: 12px; font-weight: 500; color: #8b949e; }
  .ad-edit-form .form-group label .required-star { color: #f85149; margin-left: 2px; }
  .ad-edit-form .form-group .field-hint { font-size: 10px; color: #484f58; margin-top: 2px; font-style: italic; }
  .ad-edit-form .form-group .field-hint i { margin-right: 4px; color: #8b949e; }

  /* Statistics */
  .stat-combined-card { background: #161b22; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 20px; overflow: hidden; }
  .stat-combined-card .stat-combined-header { padding: 12px 16px; border-bottom: 1px solid #30363d; background: #0d1117; font-weight: 600; font-size: 14px; color: #58a6ff; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .stat-combined-card .stat-combined-header i { margin-right: 8px; }
  .stat-combined-card .stat-combined-body { padding: 16px; }
  .stat-combined-card .stat-combined-body canvas { width: 100% !important; max-height: 250px; }
  .stat-combined-card .stat-combined-footer { padding: 10px 16px; border-top: 1px solid #30363d; background: #0d1117; display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; flex-wrap: wrap; gap: 8px; }
  .stat-combined-card .stat-combined-footer strong { color: #58a6ff; }

  .region-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .region-grid.single { grid-template-columns: 1fr; }
  .region-grid.two { grid-template-columns: 1fr 1fr; }
  .region-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 1200px) {
    .region-grid { grid-template-columns: 1fr 1fr; }
    .region-grid.single { grid-template-columns: 1fr; }
    .region-grid.three { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 768px) {
    .region-grid, .region-grid.two, .region-grid.three { grid-template-columns: 1fr; }
  }

  .region-card { background: #161b22; border-radius: 10px; border: 1px solid #30363d; overflow: hidden; display: flex; flex-direction: column; }
  .region-card .region-card-header { padding: 10px 14px; border-bottom: 1px solid #30363d; background: #0d1117; font-weight: 600; font-size: 13px; color: #58a6ff; display: flex; justify-content: space-between; align-items: center; }
  .region-card .region-card-header .region-name { display: flex; align-items: center; gap: 6px; }
  .region-card .region-card-header .region-name i { color: #8b949e; }
  .region-card .region-card-header .region-rev { color: #3fb950; font-size: 12px; font-weight: 700; }
  .region-card .region-chart-body { padding: 10px 12px 6px; }
  .region-card .region-chart-body canvas { width: 100% !important; max-height: 160px; }
  .region-card .region-chart-empty { text-align: center; padding: 30px 10px; color: #484f58; font-size: 11px; }
  .region-card .region-chart-empty i { font-size: 22px; opacity: 0.4; display: block; margin-bottom: 6px; }
  .region-card .region-chart-footer { padding: 4px 12px 10px; font-size: 11px; color: #8b949e; display: flex; justify-content: space-between; }
  .region-card .region-chart-footer strong { color: #58a6ff; }

  .expandable { border-top: 1px solid #30363d; }
  .expandable .expandable-header { padding: 8px 14px; cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; background: #0d1117; }
  .expandable .expandable-header:hover { background: rgba(88, 166, 255, 0.06); }
  .expandable .expandable-header .expandable-title { font-size: 11px; font-weight: 600; color: #8b949e; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .expandable .expandable-header .expandable-title i.chevron { font-size: 9px; transition: transform 0.25s ease; color: #58a6ff; }
  .expandable.open .expandable-header .expandable-title i.chevron { transform: rotate(90deg); }
  .expandable .expandable-header .expandable-count { font-size: 10px; color: #58a6ff; font-weight: 600; background: rgba(88, 166, 255, 0.1); padding: 1px 8px; border-radius: 10px; }
  .expandable .expandable-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: #161b22; }
  .expandable.open .expandable-body { max-height: 320px; overflow-y: auto; }
  .expandable .expandable-body-inner { padding: 6px 10px 10px; }

  .mini-row { display: flex; align-items: center; padding: 4px 0; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .mini-row:last-child { border-bottom: none; }
  .mini-row .mini-rank { font-size: 10px; color: #8b949e; min-width: 18px; font-weight: 600; text-align: right; }
  .mini-row .mini-name { font-size: 11px; color: #e6edf3; flex: 1; min-width: 60px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-row .mini-amount { font-size: 11px; color: #58a6ff; font-weight: 600; min-width: 62px; text-align: right; }
  .mini-row .mini-bar-container { flex: 1; min-width: 30px; max-width: 70px; height: 6px; background: #0d1117; border-radius: 3px; overflow: hidden; }
  .mini-row .mini-bar { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .mini-row .mini-percent { font-size: 10px; color: #8b949e; min-width: 32px; text-align: right; }
  .mini-row.inactive { opacity: 0.5; }
  .mini-row.inactive .mini-name, .mini-row.inactive .mini-amount, .mini-row.inactive .mini-percent { color: #484f58; }
  .mini-empty { text-align: center; padding: 14px; color: #484f58; font-size: 11px; }
  .mini-inactive-note { margin-top: 6px; padding: 4px 8px; background: rgba(248, 81, 73, 0.08); border-left: 2px solid #f85149; border-radius: 3px; font-size: 10px; color: #f85149; }

  .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: white; font-size: 14px; font-weight: 500; z-index: 99999; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transform: translateX(120%); transition: transform 0.4s ease; max-width: 400px; }
  .toast.show { transform: translateX(0); }
  .toast.success { background: #238636; }
  .toast.error { background: #c62828; }
  .toast.info { background: #1a3a6b; }

  .manage-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .manage-table th { text-align: left; font-size: 12px; color: #8b949e; padding: 8px 10px; border-bottom: 1px solid #30363d; font-weight: 600; }
  .manage-table td { padding: 8px 10px; font-size: 13px; color: #e6edf3; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .manage-table tr:hover td { background: rgba(88, 166, 255, 0.05); }
  .manage-table .del-btn { background: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.4); padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600; }
  .manage-table .del-btn:hover { background: rgba(248, 81, 73, 0.3); }
  .manage-add-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; margin-top: 16px; padding-top: 16px; border-top: 1px solid #30363d; }
  .manage-add-row .form-group { display: flex; flex-direction: column; gap: 4px; }

<body>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
// ============================================================
// CONFIG
// ============================================================
const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbxrEHF2zu0VkVysX2H76tmOMX2D6JcC26iVx_iFBDdF__8kz0UB5_hyEBgDcGns9WX1/exec';

const REGIONS = ['Sangli', 'Satara', 'Kolhapur', 'Kokan'];
const REGION_ORDER = ['Kolhapur', 'Sangli', 'Satara', 'Kokan'];
const DESK_OPTIONS = ['City', 'Gram'];

const FILTER_MAP = {
  filterDesk: 'Desk',
  filterAgency: 'Agency/Reporter',
  filterExecutive: 'Executive',
  filterToDTP: 'To-DTP',
  filterFile: 'File',
  filterICDUser: 'ICD-User',
  filterICDRemark: 'ICD-Remark'
};

const STATISTICS_ROLES = ['Admin','Auth-All','Auth-City','Auth-Gram'];
const AD_EDIT_ROLES = ['Admin','Advt','ICD'];
const EXEC_MANAGE_ROLES = ['Admin','Auth-All','Auth-City','Auth-Gram'];
const AGENCY_MANAGE_ROLES = ['Admin','Advt','Auth-All','Auth-City','Auth-Gram'];
const ICD_EDITABLE_FIELDS = ['To-DTP','File','ICD-User','ICD-Remark'];

// ============================================================
// GLOBAL STATE
// ============================================================
let loggedInUser = null;
let currentTab = '';
let accessibleRegions = [];
let regionData = {};
let statisticsData = null;
let currentEditRowIndex = -1;
let isAddMode = false;
let currentEditRegion = '';
let datePickerInstance = null;
let chartInstances = {};
let headerStatsCache = null;

// ============================================================
// API CALL
// ============================================================
function callAPI(action, params) {
  return new Promise(function(resolve, reject) {
    if (!params) params = {};
    const token = localStorage.getItem('sessionToken');
    if (token) params.token = token;
    if (loggedInUser && loggedInUser.username && !params.username) params.username = loggedInUser.username;

    let url = API_BASE_URL + '?action=' + encodeURIComponent(action) + '&params=' + encodeURIComponent(JSON.stringify(params));

    fetch(url, { method: 'GET', mode: 'cors', cache: 'no-cache' })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        if (data && data.error && typeof data.error === 'string' && data.error.indexOf('Session expired') !== -1) {
          logout();
          reject(new Error('Session expired'));
          return;
        }
        resolve(data);
      })
      .catch(function(err) {
        const cb = 'jsonp_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const timeoutId = setTimeout(function() {
          if (window[cb]) { delete window[cb]; reject(new Error('Request timeout')); }
        }, 15000);
        window[cb] = function(data) {
          clearTimeout(timeoutId);
          delete window[cb];
          if (data && data.error && typeof data.error === 'string' && data.error.indexOf('Session expired') !== -1) {
            logout();
            reject(new Error('Session expired'));
            return;
          }
          resolve(data);
        };
        const s = document.createElement('script');
        s.src = url + '&callback=' + cb;
        s.onerror = function() { clearTimeout(timeoutId); delete window[cb]; reject(new Error('JSONP failed')); };
        document.body.appendChild(s);
        setTimeout(function() { if (s.parentNode) s.parentNode.removeChild(s); }, 16000);
      });
  });
}

// ============================================================
// HELPERS
// ============================================================
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function escapeJs(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, ' ');
}

function formatCurrency(n) {
  const num = Math.round(parseInt(n, 10) || 0);
  if (num === 0) return '0';
  const str = num.toString();
  const last3 = str.slice(-3);
  const rest = str.slice(0, -3);
  return rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3 : last3;
}

function formatDateForDisplay(d) {
  if (!d) return '';
  d = String(d).trim();
  if (/^\d{2}-\d{2}-\d{4}$/.test(d)) return d;
  if (/^\d{8}$/.test(d)) return d.slice(0,2) + '-' + d.slice(2,4) + '-' + d.slice(4,8);
  return d;
}

function formatDateForSheet(d) { return formatDateForDisplay(d); }

function getTodayFormatted() {
  const t = new Date();
  return String(t.getDate()).padStart(2,'0') + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + t.getFullYear();
}

function getColorFromString(str) {
  const colors = ['#1a3a6b','#6f42c1','#c0392b','#2a9922','#c79306','#2245f2','#8e44ad','#2980b9'];
  let hash = 0;
  str = str || '';
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function showToast(msg, type) {
  type = type || 'info';
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function() { t.classList.remove('show'); }, 3200);
}

// ============================================================
// ROLE HELPERS
// ============================================================
function isAdmin()  { return loggedInUser && loggedInUser.role === 'Admin'; }
function isICD()    { return loggedInUser && loggedInUser.role === 'ICD'; }
function isAdvt()   { return loggedInUser && loggedInUser.role === 'Advt'; }
function canEditAds()      { return loggedInUser && AD_EDIT_ROLES.indexOf(loggedInUser.role) !== -1; }
function canManageExec()   { return loggedInUser && EXEC_MANAGE_ROLES.indexOf(loggedInUser.role) !== -1; }
function canManageAgency() { return loggedInUser && AGENCY_MANAGE_ROLES.indexOf(loggedInUser.role) !== -1; }

// ============================================================
// LOGIN
// ============================================================
async function handleLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errEl.classList.remove('show');

  if (!username || !password) {
    errEl.textContent = 'Please enter name and password.';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Authenticating...';

  try {
    const result = await callAPI('authenticateUser', { username: username, password: password });
    if (result.success && result.user) {
      loggedInUser = result.user;
      localStorage.setItem('sessionToken', result.user.sessionToken);
      localStorage.setItem('username', result.user.username);
      localStorage.setItem('userRole', result.user.role);
      localStorage.setItem('userAccess', result.user.access);
      localStorage.setItem('userName', result.user.name);

      if (result.user.access === 'All') {
        accessibleRegions = REGIONS.slice();
      } else if (REGIONS.indexOf(result.user.access) !== -1) {
        accessibleRegions = [result.user.access];
      } else {
        accessibleRegions = [];
      }

      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('mainContent').style.display = 'block';
      document.getElementById('headerUserName').textContent = result.user.name || result.user.username;
      document.getElementById('headerUserRole').textContent = (result.user.role || 'User') + ' · ' + (result.user.access || '—');

      showToast('Welcome, ' + (result.user.name || 'User') + '!', 'success');

      buildTabs();
      await loadInitialData();
      await updateGlobalHeaderStats();
    } else {
      errEl.textContent = result.message || 'Invalid credentials.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-sign-in"></i> Sign In';
    }
  } catch (e) {
    errEl.textContent = 'Server error. Please try again.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-sign-in"></i> Sign In';
  }
}

function logout() {
  localStorage.clear();
  loggedInUser = null;
  accessibleRegions = [];
  regionData = {};
  statisticsData = null;
  currentTab = '';
  headerStatsCache = null;
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').classList.remove('show');
  const btn = document.getElementById('loginBtn');
  btn.disabled = false;
  btn.innerHTML = '<i class="fa fa-sign-in"></i> Sign In';
  showToast('Logged out.', 'info');
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('loginPassword').addEventListener('keydown', function(e) { if (e.key === 'Enter') handleLogin(); });
  document.getElementById('loginUsername').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('loginPassword').focus(); });
  document.getElementById('loginUsername').focus();
  const token = localStorage.getItem('sessionToken');
  const username = localStorage.getItem('username');
  if (token && username) {
    document.getElementById('loginUsername').value = username;
  }
});

// ============================================================
// BUILD TABS
// ============================================================
function buildTabs() {
  const container = document.getElementById('tabsContainer');
  const tabContent = document.getElementById('tabContentContainer');
  container.innerHTML = '';
  tabContent.innerHTML = '';

  const orderedRegions = REGION_ORDER.filter(function(r) { return accessibleRegions.indexOf(r) !== -1; });
  if (canEditAds()) {
    orderedRegions.forEach(function(region) {
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.setAttribute('data-tab', region);
      btn.innerHTML = '<i class="fa fa-table"></i> ' + escapeHtml(region);
      btn.onclick = function() { switchTab(region); };
      container.appendChild(btn);

      const content = document.createElement('div');
      content.className = 'tab-content';
      content.id = 'tab-' + region;
      content.innerHTML = buildTabContentHTML(region);
      tabContent.appendChild(content);
    });
  }

  if (STATISTICS_ROLES.indexOf(loggedInUser.role) !== -1) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.setAttribute('data-tab', 'statistics');
    btn.innerHTML = '<i class="fa fa-bar-chart"></i> Statistics';
    btn.onclick = function() { switchTab('statistics'); };
    container.appendChild(btn);

    const content = document.createElement('div');
    content.className = 'tab-content';
    content.id = 'tab-statistics';
    content.innerHTML = `
      <div style="margin-bottom:16px;"><div class="stats-bar" id="statsBar-statistics"></div></div>
      <div id="graphSection"></div>
    `;
    tabContent.appendChild(content);
  }

  const firstTab = container.querySelector('.tab-btn');
  if (firstTab) switchTab(firstTab.getAttribute('data-tab'));
}

function buildTabContentHTML(region) {
  return `
    <div class="filters-section">
      <div class="filter-group">
        <label>City</label>
        <select id="filterCity-${region}" disabled>
          <option value="${region}" selected>${region}</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Desk</label>
        <select id="filterDesk-${region}" onchange="applyFilters('${region}')"><option value="__ALL__">All</option></select>
      </div>
      <div class="filter-group">
        <label>Agency/Reporter</label>
        <select id="filterAgency-${region}" onchange="applyFilters('${region}')"><option value="__ALL__">All</option></select>
        ${canManageAgency() ? `<button class="gear-btn" title="Manage Agencies" onclick="openManageAgency('${region}')"><i class="fa fa-cog"></i></button>` : ''}
      </div>
      <div class="filter-group">
        <label>Executive</label>
        <select id="filterExecutive-${region}" onchange="applyFilters('${region}')"><option value="__ALL__">All</option></select>
        ${canManageExec() ? `<button class="gear-btn" title="Manage Executives" onclick="openManageExec('${region}')"><i class="fa fa-cog"></i></button>` : ''}
      </div>
      <div class="filter-group">
        <label>To-DTP</label>
        <select id="filterToDTP-${region}" onchange="applyFilters('${region}')"><option value="__ALL__">All</option></select>
      </div>
      <div class="filter-group">
        <label>File</label>
        <select id="filterFile-${region}" onchange="applyFilters('${region}')"><option value="__ALL__">All</option></select>
      </div>
      <div class="filter-group">
        <label>ICD-User</label>
        <select id="filterICDUser-${region}" onchange="applyFilters('${region}')"><option value="__ALL__">All</option></select>
      </div>
      <div class="filter-group">
        <label>ICD-Remark</label>
        <select id="filterICDRemark-${region}" onchange="applyFilters('${region}')"><option value="__ALL__">All</option></select>
      </div>
        ${canEditAds() && !isICD() ? `
      <div class="fab-container">
        <button class="fab-btn" onclick="openAddModal('${region}')" title="Add New Advertisement"><i class="fa fa-plus"></i></button>
      </div>` : ''}
      ${isICD() ? `
      <div class="fab-container">
        <button class="edit-list-inline-btn" onclick="openEditListModal()" title="Edit List (Bulk ICD Assignment)">
          <i class="fa fa-list-alt"></i> Edit List
        </button>
      </div>` : ''}
    </div>
    <div class="stats-bar" id="statsBar-${region}">
      <div class="stats-row stats-main">
        <span class="stat-item">📋 <strong id="displayCount-${region}">0</strong> ads</span>
        <span class="stat-divider">|</span>
        <span class="stat-item">🏢 <strong id="displayDesks-${region}">0</strong> desks</span>
        <span class="stat-divider">|</span>
        <span class="stat-item">👤 <strong id="displayExecutives-${region}">0</strong> executives</span>
        <span class="stat-divider">|</span>
        <span class="stat-item">📰 <strong id="displayAgencies-${region}">0</strong> agencies</span>
      </div>
    </div>
    <div class="ads-grid" id="adsGrid-${region}">
      <div class="loading-spinner"><i class="fa fa-spinner fa-spin"></i> Loading...</div>
    </div>
  `;
}

// ============================================================
// TAB SWITCH
// ============================================================
async function switchTab(tabName) {
  currentTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });

  const btn = document.querySelector('.tab-btn[data-tab="' + tabName + '"]');
  if (btn) btn.classList.add('active');
  const content = document.getElementById('tab-' + tabName);
  if (content) content.classList.add('active');

  if (tabName === 'statistics') {
    await loadStatistics();
    headerStatsCache = null;
    if (!isICD()) await updateGlobalHeaderStats();
  } else {
    if (!regionData[tabName] || !regionData[tabName].loaded) {
      await loadRegion(tabName);
    } else {
      applyFilters(tabName);
    }
    if (!isICD()) await updateGlobalHeaderStats();
  }
}

// ============================================================
// INITIAL LOAD
// ============================================================
async function loadInitialData() {
  if (canEditAds() && accessibleRegions.length > 0) {
    const firstRegion = REGION_ORDER.filter(function(r) { return accessibleRegions.indexOf(r) !== -1; })[0];
    if (firstRegion) await loadRegion(firstRegion);
  } else if (STATISTICS_ROLES.indexOf(loggedInUser.role) !== -1) {
    await loadStatistics();
  }
}

async function loadRegion(region) {
  if (regionData[region] && regionData[region].loaded) return;
  showLoadingCard(region);
  try {
    const result = await callAPI('getDashboardData', { region: region });
    if (result.success) {
      regionData[region] = {
        ads: result.ads || [],
        filters: result.filters || {},
        agencies: result.agencies || [],
        executives: result.executives || [],
        icdUsers: result.icdUsers || [],
        loaded: true
      };
      populateRegionFilters(region);
      applyFilters(region);
    } else {
      showErrorInGrid(region, result.error || 'Failed to load.');
    }
  } catch (e) {
    showErrorInGrid(region, e.message);
  }
}

function showLoadingCard(region) {
  const g = document.getElementById('adsGrid-' + region);
  if (g) g.innerHTML = '<div class="loading-spinner"><i class="fa fa-spinner fa-spin"></i> Loading advertisement data...</div>';
}

function showErrorInGrid(region, msg) {
  const g = document.getElementById('adsGrid-' + region);
  if (!g) return;
  g.innerHTML = '<div class="no-results"><i class="fa fa-exclamation-triangle" style="color:#f85149;"></i>' + escapeHtml(msg) + '</div>';
}

// ============================================================
// POPULATE FILTERS — Agency / Executive / ICD from master lists
// ============================================================
function populateRegionFilters(region) {
  const d = regionData[region];
  if (!d) return;

  Object.keys(FILTER_MAP).forEach(function(filterId) {
    if (filterId === 'filterAgency' || filterId === 'filterExecutive' || filterId === 'filterICDUser') return;
    const col = FILTER_MAP[filterId];
    const sel = document.getElementById(filterId + '-' + region);
    if (!sel) return;
    const values = (d.filters[col] || []).slice().sort();
    let html = '<option value="__ALL__">All</option>';
    values.forEach(function(v) {
      let disp = v;
      if (col === 'To-DTP') disp = formatDateForDisplay(v);
      html += '<option value="' + escapeHtml(v) + '">' + escapeHtml(disp) + '</option>';
    });
    sel.innerHTML = html;
  });

  const agencySel = document.getElementById('filterAgency-' + region);
  if (agencySel) {
    let html = '<option value="__ALL__">All</option>';
    (d.agencies || []).forEach(function(a) {
      html += '<option value="' + escapeHtml(a) + '">' + escapeHtml(a) + '</option>';
    });
    agencySel.innerHTML = html;
  }

  const execSel = document.getElementById('filterExecutive-' + region);
  if (execSel) {
    let html = '<option value="__ALL__">All</option>';
    (d.executives || []).forEach(function(e) {
      html += '<option value="' + escapeHtml(e.Name) + '">' + escapeHtml(e.Name) + '</option>';
    });
    execSel.innerHTML = html;
  }

  const icdSel = document.getElementById('filterICDUser-' + region);
  if (icdSel) {
    let html = '<option value="__ALL__">All</option>';
    (d.icdUsers || []).forEach(function(u) {
      html += '<option value="' + escapeHtml(u) + '">' + escapeHtml(u) + '</option>';
    });
    icdSel.innerHTML = html;
  }
}

// ============================================================
// APPLY FILTERS
// ============================================================
function applyFilters(region) {
  const d = regionData[region];
  if (!d) return;

  const active = {};
  Object.keys(FILTER_MAP).forEach(function(filterId) {
    const col = FILTER_MAP[filterId];
    const sel = document.getElementById(filterId + '-' + region);
    if (sel && sel.value && sel.value !== '__ALL__') active[col] = sel.value;
  });

  const filtered = d.ads.filter(function(ad) {
    for (const k in active) {
      let adVal = ad[k] || '';
      if (k === 'To-DTP') adVal = formatDateForDisplay(adVal);
      if (adVal !== active[k]) return false;
    }
    return true;
  });

  renderAds(filtered, region);
  updateRegionStats(region, filtered);
}

function updateRegionStats(region, ads) {
  const desks = new Set(), execs = new Set(), agencies = new Set();
  ads.forEach(function(ad) {
    if (ad.Desk) desks.add(ad.Desk);
    if (ad.Executive) execs.add(ad.Executive);
    if (ad['Agency/Reporter']) agencies.add(ad['Agency/Reporter']);
  });
  document.getElementById('displayCount-' + region).textContent = ads.length;
  document.getElementById('displayDesks-' + region).textContent = desks.size;
  document.getElementById('displayExecutives-' + region).textContent = execs.size;
  document.getElementById('displayAgencies-' + region).textContent = agencies.size;
}

// ============================================================
// RENDER ADS
// ============================================================
function renderAds(ads, region) {
  const grid = document.getElementById('adsGrid-' + region);
  if (!grid) return;
  if (ads.length === 0) {
    grid.innerHTML = '<div class="no-results"><i class="fa fa-search"></i>No advertisements found matching filters.</div>';
    return;
  }
  const d = regionData[region];
  let html = '';
  ads.forEach(function(ad) {
    const realIndex = d.ads.indexOf(ad);
    html += buildAdCard(ad, realIndex, region);
  });
  grid.innerHTML = html;
}

function openAddModal(region) {
  if (!canEditAds()) return;
  isAddMode = true;
  currentEditRegion = region;
  currentEditRowIndex = -1;

  const modal = document.getElementById('editAdModal');
  const title = document.getElementById('modalTitle');
  title.innerHTML = '<i class="fa fa-plus"></i> Add New Advertisement (' + region + ')';
  modal.classList.add('show');

  const emptyAd = {
    Desk: '', 'Agency/Reporter': '', Executive: '', Client: '',

    'To-DTP': getTodayFormatted(), File: '',
    'ICD-User': '', 'ICD-Remark': ''
  };
  renderEditForm(emptyAd, region);
}

async function openEditModal(region, rowIndex) {
  if (!canEditAds()) return;
  isAddMode = false;
  currentEditRegion = region;
  currentEditRowIndex = rowIndex;

  const modal = document.getElementById('editAdModal');
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('editModalBody');
  const saveBtn = document.getElementById('saveAdBtn');

  modal.classList.add('show');

  saveBtn.disabled = true;

  const sheetRow = rowIndex + 2;

  try {
    const result = await callAPI('getAdData', { region: region, rowIndex: sheetRow });

    body.innerHTML = '<div class="no-results" style="padding:20px;margin:0;"><i class="fa fa-exclamation-triangle" style="color:#f85149;"></i><p style="color:#f85149;">' + escapeHtml(e.message) + '</p></div>';

}

function renderEditForm(ad, region) {
  const body = document.getElementById('editModalBody');
  const saveBtn = document.getElementById('saveAdBtn');
  saveBtn.style.display = 'inline-block';

  if (datePickerInstance) { datePickerInstance.destroy(); datePickerInstance = null; }

  const d = regionData[region] || { executives: [], agencies: [], icdUsers: [] };

  const readOnlyStyle = 'background:#161b22 !important;color:#8b949e !important;cursor:not-allowed !important;opacity:0.7 !important;';

  const execOptions = d.executives || [];
  const agencyOptions = d.agencies || [];

    let h = '<option value="">— Select —</option>';

    });

  function icdOptionsHTML(selected) {

      h += `<option value="${escapeHtml(u)}" ${u === selected ? 'selected' : ''}>${escapeHtml(u)}</option>`;
    });
    return h;
  }

  html += '<div class="form-group"><label>Executive <span class="required-star">*</span>' + (ro('Executive') ? ' <span style="color:#f85149;font-size:10px;">(view only)</span>' : '') + '</label>';

  html += '<div class="field-hint"><i class="fa fa-info-circle"></i> Filtered to ' + region + '</div></div>';

  html += '<div class="form-group"><label>Client</label>';
  html += '<input type="text" id="edit_Client" value="' + escapeHtml(ad.Client || '') + '" ' + (ro('Client') ? 'disabled style="' + readOnlyStyle + '"' : '') + '></div>';

  html += '<div class="form-group"><label>Agency/Reporter</label>';

  html += '<div class="form-group"><label>Width</label>';
  html += '<input type="text" id="edit_Size-Width" value="' + escapeHtml(ad['Size-Width'] || '') + '" oninput="updateCalculations(\'size\')" ' + (ro('Size-Width') ? 'disabled style="' + readOnlyStyle + '"' : '') + '></div>';

  html += '<div class="form-group"><label>Height</label>';
  html += '<input type="text" id="edit_Size-Height" value="' + escapeHtml(ad['Size-Height'] || '') + '" oninput="updateCalculations(\'size\')" ' + (ro('Size-Height') ? 'disabled style="' + readOnlyStyle + '"' : '') + '></div>';

  html += '<div class="form-group"><label>SQCM <span style="color:#58a6ff;font-size:10px;">(auto)</span></label>';
  html += '<input type="text" id="edit_SQCM" value="' + escapeHtml(ad.SQCM || '0') + '" readonly class="calculated-field"></div>';

  html += '<div class="form-group"><label>Total with GST</label>';
  html += '<input type="text" id="edit_Total_with_GST" value="' + escapeHtml(ad.Total_with_GST || '') + '" oninput="updateCalculations(\'total\')" ' + (ro('Total_with_GST') ? 'disabled style="' + readOnlyStyle + '"' : '') + '></div>';

  html += '<div class="form-group"><label>Net Amount</label>';
  html += '<input type="text" id="edit_Net_Amount" value="' + escapeHtml(ad.Net_Amount || '') + '" oninput="updateCalculations(\'net\')" ' + (ro('Net_Amount') ? 'disabled style="' + readOnlyStyle + '"' : '') + '></div>';

  html += '<div class="form-group"><label>GST (5%) <span style="color:#58a6ff;font-size:10px;">(auto)</span></label>';
  html += '<input type="text" id="edit_GST" value="' + escapeHtml(ad.GST || '0') + '" readonly class="calculated-field"></div>';

  html += '<div class="form-group"><label>Rate <span style="color:#58a6ff;font-size:10px;">(auto)</span></label>';

  setTimeout(function() { autoPopulateDesk(); updateCalculations('init'); }, 50);

  const dateInput = document.getElementById('edit_To-DTP');
  if (dateInput && !dateInput.disabled) {

      dateFormat: 'd-m-Y',
      allowInput: true,
      defaultDate: dateInput.value || (isAddMode ? getTodayFormatted() : undefined)
    });
  }
}

function autoPopulateDesk() {
  const execSel = document.getElementById('edit_Executive');
  const deskInput = document.getElementById('edit_Desk');
  if (!execSel || !deskInput) return;
  const opt = execSel.options[execSel.selectedIndex];
  const desk = opt ? (opt.getAttribute('data-desk') || '') : '';
  deskInput.value = desk;
}

function updateCalculations(source) {
  const widthEl = document.getElementById('edit_Size-Width');
  const heightEl = document.getElementById('edit_Size-Height');
  const sqcmEl = document.getElementById('edit_SQCM');
  const totalEl = document.getElementById('edit_Total_with_GST');
  const netEl = document.getElementById('edit_Net_Amount');
  const gstEl = document.getElementById('edit_GST');
  const rateEl = document.getElementById('edit_Rate');
  if (!widthEl || !heightEl || !sqcmEl) return;

  const w = parseInt(widthEl.value) || 0;
  const h = parseInt(heightEl.value) || 0;
  const sqcm = w * h;
  sqcmEl.value = sqcm;

  if (!totalEl || !netEl || !gstEl || !rateEl) return;

  let net = parseInt(netEl.value) || 0;

  if (source === 'total') {
    const total = parseInt(totalEl.value) || 0;
    if (total > 0) {
      net = Math.round((total / 105) * 100);
      const gst = Math.round(net * 0.05);
      netEl.value = net;
      gstEl.value = gst;
    } else {
      netEl.value = '0'; gstEl.value = '0'; net = 0;
    }
  } else if (source === 'net') {
    if (net > 0) {
      const total = Math.round(net * 1.05);
      const gst = Math.round(net * 0.05);
      totalEl.value = total;
      gstEl.value = gst;
    } else {
      totalEl.value = '0'; gstEl.value = '0';
    }
  }

  if (net > 0 && sqcm > 0) {
    rateEl.value = Math.round(net / sqcm);
  } else {
    rateEl.value = '0';
  }
}

function handleAgencyEditChange(sel) {
  if (sel.value === '__ADD_NEW__') {
    const name = prompt('Enter new Agency/Reporter name:');
    if (name && name.trim()) {
      const trimmed = name.trim();
      const opt = document.createElement('option');
      opt.value = trimmed;
      opt.textContent = trimmed;
      opt.selected = true;
      sel.insertBefore(opt, sel.options[sel.options.length - 1]);
      callAPI('addAgency', { name: trimmed, city: currentEditRegion }).then(function(r) {
        if (r.success) {
          showToast('Agency added.', 'success');
          if (regionData[currentEditRegion]) {
            regionData[currentEditRegion].agencies.push(trimmed);
          }
        } else {
          showToast(r.error || 'Failed.', 'error');
        }
      });
    } else {
      sel.value = '';
    }
  }
}

async function saveAdData() {
  const btn = document.getElementById('saveAdBtn');
  btn.disabled = true;
  const origLabel = btn.innerHTML;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Saving...';

  try {
    const region = currentEditRegion;

    const adData = {};
    function readVal(id) {
      const el = document.getElementById('edit_' + id);
      return el ? el.value.trim() : '';
    }

    adData.Desk = readVal('Desk');
    adData['Agency/Reporter'] = readVal('Agency');
    adData.Executive = readVal('Executive');
    adData.Client = readVal('Client');
    adData['Size-Width'] = readVal('Size-Width');
    adData['Size-Height'] = readVal('Size-Height');
    adData.SQCM = readVal('SQCM');
    adData.Total_with_GST = readVal('Total_with_GST');
    adData.Net_Amount = readVal('Net_Amount');
    adData.GST = readVal('GST');
    adData.Rate = readVal('Rate');
    adData['To-DTP'] = formatDateForSheet(readVal('To-DTP'));
    adData.File = readVal('File');
    adData['ICD-User'] = readVal('ICD-User');
    adData['ICD-Remark'] = readVal('ICD-Remark');

    let result;
    if (isAddMode) {
      result = await callAPI('addAd', { adData: adData, region: region });
    } else {
      const sheetRow = currentEditRowIndex + 2;
      result = await callAPI('updateAd', { adData: adData, region: region, rowIndex: sheetRow });
    }

    if (result.success) {
      showToast(isAddMode ? 'Ad added.' : 'Ad updated.', 'success');
      delete regionData[region];
      await loadRegion(region);
      closeEditModal();
      headerStatsCache = null;
      await updateGlobalHeaderStats();
    } else {
      showToast(result.error || 'Save failed.', 'error');
    }
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = origLabel;
  }
}

function closeEditModal() {
  if (datePickerInstance) { datePickerInstance.destroy(); datePickerInstance = null; }
  document.getElementById('editAdModal').classList.remove('show');
}

function renderEditListTable(region) {
  const body = document.getElementById('editListModalBody');
  const d = regionData[region];
  const icdOptions = d.icdUsers || [];

  // Apply current filters (same as the card grid)
  const active = {};
  Object.keys(FILTER_MAP).forEach(function(filterId) {
    const col = FILTER_MAP[filterId];
    const sel = document.getElementById(filterId + '-' + region);
    if (sel && sel.value && sel.value !== '__ALL__') active[col] = sel.value;
  });

  const filtered = d.ads.filter(function(ad) {
    for (const k in active) {
      let adVal = ad[k] || '';
      if (k === 'To-DTP') adVal = formatDateForDisplay(adVal);
      if (adVal !== active[k]) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    body.innerHTML = '<div class="no-results" style="margin:0;"><i class="fa fa-search"></i>No advertisements found matching the current filters.</div>';
    return;
  }

  function icdSelectHTML(selected, rowKey) {
    let h = '<option value="">— Select —</option>';
    icdOptions.forEach(function(u) {
      h += '<option value="' + escapeHtml(u) + '"' + (u === selected ? ' selected' : '') + '>' + escapeHtml(u) + '</option>';
    });
    // Include existing value if not in master (so it's not lost)
    if (selected && icdOptions.indexOf(selected) === -1) {
      h += '<option value="' + escapeHtml(selected) + '" selected>' + escapeHtml(selected) + ' (not in master)</option>';
    }
    return '<select data-row="' + rowKey + '" data-field="ICD-User" class="icd-edit-input">' + h + '</select>';
  }

  let html = '<div class="icd-edit-table-wrap"><table class="icd-edit-table">';
  html += '<thead><tr><th style="width:20%;">Executive</th><th style="width:15%;">To-DTP</th><th style="width:20%;">File</th><th style="width:25%;">ICD</th><th style="width:20%;">ICD-Remark</th></tr></thead><tbody>';

  filtered.forEach(function(ad) {
    const realIndex = d.ads.indexOf(ad);       // 0-based within d.ads
    const sheetRow = realIndex + 2;            // 1-based sheet row

    html += '<tr>' +
      '<td class="ro-cell">' + escapeHtml(ad.Executive || '—') + '</td>' +
      '<td><input type="text" class="icd-edit-input" data-row="' + sheetRow + '" data-field="To-DTP" value="' + escapeHtml(formatDateForDisplay(ad['To-DTP'] || '')) + '" placeholder="dd-mm-yyyy"></td>' +
      '<td><input type="text" class="icd-edit-input" data-row="' + sheetRow + '" data-field="File" value="' + escapeHtml(ad.File || '') + '"></td>' +
      '<td>' + icdSelectHTML(ad['ICD-User'] || '', sheetRow) + '</td>' +
      '<td><input type="text" class="icd-edit-input" data-row="' + sheetRow + '" data-field="ICD-Remark" value="' + escapeHtml(ad['ICD-Remark'] || '') + '"></td>' +
      '</tr>';
  });

  html += '</tbody></table></div>';
  html += '<div style="margin-top:10px;color:#8b949e;font-size:11px;"><i class="fa fa-info-circle"></i> Showing ' + filtered.length + ' ads (matching current filters). Edit any field and click <strong>Save All</strong>.</div>';

  body.innerHTML = html;
}

async function saveEditList() {
  if (!isICD()) return;
  const region = currentTab;
  if (!region || region === 'statistics') return;

  const btn = document.getElementById('saveListBtn');
  const inputs = document.querySelectorAll('#editListModalBody .icd-edit-input');

  // Group by row
  const rowsMap = {};
  inputs.forEach(function(el) {
    const rowKey = el.getAttribute('data-row');
    const field = el.getAttribute('data-field');
    if (!rowsMap[rowKey]) rowsMap[rowKey] = { rowIndex: parseInt(rowKey, 10) };
    rowsMap[rowKey][field] = el.value;
  });

  const updates = Object.keys(rowsMap).map(function(k) {
    const r = rowsMap[k];
    // Normalize To-DTP to sheet format
    if (r['To-DTP'] !== undefined) {
      r['To-DTP'] = formatDateForSheet(r['To-DTP']);
    }
    return r;
  });

  if (updates.length === 0) {
    showToast('No rows to save.', 'info');
    return;
  }

  btn.disabled = true;
  const origLabel = btn.innerHTML;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Saving...';

  try {
    const result = await callAPI('updateICDBatch', { region: region, updates: updates });
    if (result.success) {
      showToast(result.message || ('Saved ' + updates.length + ' rows.'), 'success');
      // Reload region
      delete regionData[region];
      await loadRegion(region);
      closeEditListModal();
      headerStatsCache = null;
      await updateGlobalHeaderStats();
    } else {
      showToast(result.error || 'Save failed.', 'error');
    }
  } catch (e) {
    showToast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = origLabel;
  }
}

  } catch (e) {

function renderStatistics() {
  const d = statisticsData;
  if (!d) return;

  Object.keys(chartInstances).forEach(function(k) {
    if (chartInstances[k]) chartInstances[k].destroy();
  });
  chartInstances = {};

  renderStatsBar(d);

  const graphSection = document.getElementById('graphSection');
  if (!graphSection) return;

  const accessibleRegions = d.accessibleRegions || [];
  const perRegion = d.perRegion || {};
  const regionOrder = (d.regionOrder || REGION_ORDER).filter(function(r) {
    return accessibleRegions.indexOf(r) !== -1;
  });

  const showCombined = accessibleRegions.length > 1;
  let html = '';

  if (showCombined) {
    let allAds = [];
    regionOrder.forEach(function(r) {
      if (perRegion[r] && perRegion[r].ads) {
        perRegion[r].ads.forEach(function(a) { allAds.push(a); });
      }
    });
    const gdCombined = prepareGraphData(allAds);

    if (gdCombined.labels.length === 0) {
      html += `
        <div class="stat-combined-card">
          <div class="stat-combined-header"><span><i class="fa fa-line-chart"></i> Combined Revenue (Cumulative)</span></div>
          <div class="stat-combined-body" style="text-align:center;padding:40px 20px;color:#8b949e;">
            <i class="fa fa-bar-chart" style="font-size:32px;opacity:0.3;display:block;margin-bottom:12px;"></i>
            No data available
          </div>
          <div class="stat-combined-footer">
            <span>Total Revenue: <strong>₹0</strong></span>
            <span>Total Ads: <strong>0</strong></span>
          </div>
        </div>
      `;
    } else {
      html += `
        <div class="stat-combined-card">
          <div class="stat-combined-header">
            <span><i class="fa fa-line-chart"></i> Combined Revenue (Cumulative)</span>
            <span style="font-size:12px;font-weight:400;color:#8b949e;">${gdCombined.labels.length} days · All regions</span>
          </div>
          <div class="stat-combined-body"><canvas id="graphCombined"></canvas></div>
          <div class="stat-combined-footer">
            <span>Total Revenue: <strong>₹${formatCurrency(gdCombined.totalRevenue)}</strong></span>
            <span>Total Ads: <strong>${gdCombined.totalAds}</strong></span>
            <span>Avg Daily: <strong>₹${formatCurrency(gdCombined.labels.length > 0 ? Math.round(gdCombined.totalRevenue / gdCombined.labels.length) : 0)}</strong></span>
          </div>
        </div>
      `;
    }
  }

  if (regionOrder.length > 0) {
    let gridClass = 'region-grid';
    if (regionOrder.length === 1) gridClass += ' single';
    else if (regionOrder.length === 2) gridClass += ' two';
    else if (regionOrder.length === 3) gridClass += ' three';

    html += '<div class="' + gridClass + '">';
    regionOrder.forEach(function(region) {
      html += buildRegionCard(region, perRegion[region] || { ads: [], executives: {}, agencies: {}, totalRevenue: 0, totalAds: 0 });
    });
    html += '</div>';
  }

  graphSection.innerHTML = html;

  setTimeout(function() {
    if (showCombined) {
      let allAds = [];
      regionOrder.forEach(function(r) {
        if (perRegion[r] && perRegion[r].ads) {
          perRegion[r].ads.forEach(function(a) { allAds.push(a); });
        }
      });
      const gd = prepareGraphData(allAds);
      const canvas = document.getElementById('graphCombined');
      if (canvas && gd.labels.length > 0) {
        chartInstances.combined = createLineChart(canvas, gd, '#58a6ff');
      }
    }

    regionOrder.forEach(function(region) {
      const r = perRegion[region];
      if (!r) return;
      const gd = prepareGraphData(r.ads || []);
      const canvas = document.getElementById('chart-' + region);
      if (canvas && gd.labels.length > 0) {
        chartInstances[region] = createLineChart(canvas, gd, '#58a6ff');
      }
    });

      <span class="stat-item">🏙️ City Revenue: <strong style="color:#58a6ff;">₹${formatCurrency(s.cityRevenue)}</strong></span>
      <span class="stat-divider">|</span>

function buildRegionCard(region, data) {
  const gd = prepareGraphData(data.ads || []);
  const hasChart = gd.labels.length > 0;
  const role = loggedInUser ? loggedInUser.role : '';
  const autoExpand = (role !== 'Admin' && role !== 'Auth-All');

  const execEntries = Object.keys(data.executives || {}).map(function(k) {
    return { name: k, data: data.executives[k] };
  });
  execEntries.sort(function(a, b) { return b.data.revenue - a.data.revenue; });

  const agencyEntries = Object.keys(data.agencies || {}).map(function(k) {
    return { name: k, data: data.agencies[k] };
  });
  agencyEntries.sort(function(a, b) { return b.data.revenue - a.data.revenue; });

  const totalRev = data.totalRevenue || 0;

  let chartHTML = '';
  if (hasChart) {
    chartHTML = '<div class="region-chart-body"><canvas id="chart-' + region + '"></canvas></div>';
  } else {
    chartHTML = '<div class="region-chart-body"><div class="region-chart-empty"><i class="fa fa-bar-chart"></i>No data</div></div>';
  }

  return `
    <div class="region-card">
      <div class="region-card-header">
        <span class="region-name"><i class="fa fa-map-marker"></i> ${escapeHtml(region)}</span>
        <span class="region-rev">₹${formatCurrency(totalRev)}</span>
      </div>
      ${chartHTML}
      <div class="region-chart-footer">
        <span>Ads: <strong>${data.totalAds || 0}</strong></span>
        <span>Days: <strong>${gd.labels.length}</strong></span>
      </div>

      <div class="expandable${autoExpand ? ' open' : ''}" id="exec-exp-${region}">
        <div class="expandable-header" onclick="toggleExpandable('exec-exp-${region}')">
          <span class="expandable-title"><i class="fa fa-chevron-right chevron"></i> Executives</span>
          <span class="expandable-count">${execEntries.length}</span>
        </div>
        <div class="expandable-body">
          <div class="expandable-body-inner">
            ${renderMiniBarList(execEntries, totalRev, 'Executive', true)}

        </div>
      </div>

      <div class="expandable${autoExpand ? ' open' : ''}" id="agency-exp-${region}">
        <div class="expandable-header" onclick="toggleExpandable('agency-exp-${region}')">
          <span class="expandable-title"><i class="fa fa-chevron-right chevron"></i> Agencies/Reporters</span>
          <span class="expandable-count">${agencyEntries.length}</span>
        </div>

            ${renderMiniBarList(agencyEntries, totalRev, 'Agency/Reporter', false)}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderMiniBarList(entries, totalRevenue, label, shortenNames) {
  if (!entries || entries.length === 0) {
    return '<div class="mini-empty">No ' + escapeHtml(label) + ' data</div>';
  }

  const displayNameByFullName = {};
  if (shortenNames) {
    const firstNameCounts = {};
    entries.forEach(function(e) {
      const parts = String(e.name || '').trim().split(/\s+/);
      const first = parts[0] || '';
      firstNameCounts[first] = (firstNameCounts[first] || 0) + 1;
    });
    entries.forEach(function(e) {
      const parts = String(e.name || '').trim().split(/\s+/);
      const first = parts[0] || '';
      if (firstNameCounts[first] > 1 && parts.length > 1) {
        const last = parts[parts.length - 1];
        displayNameByFullName[e.name] = first + ' ' + last.charAt(0).toUpperCase() + '.';
      } else {
        displayNameByFullName[e.name] = first || e.name;
      }
    });
  } else {
    entries.forEach(function(e) { displayNameByFullName[e.name] = e.name; });
  }

  let inactiveCount = 0;
  let html = '';
  entries.forEach(function(e, idx) {
    const fullName = e.name;
    const dispName = displayNameByFullName[fullName] || fullName;
    const data = e.data;
    const isInactive = data.count === 0;
    if (isInactive) inactiveCount++;
    const pct = totalRevenue > 0 ? (data.revenue / totalRevenue * 100) : 0;
    const color = getColorFromString(fullName);
    html += '<div class="mini-row' + (isInactive ? ' inactive' : '') + '">' +
      '<span class="mini-rank">' + (idx + 1) + '</span>' +
      '<span class="mini-name" title="' + escapeHtml(fullName) + '">' + escapeHtml(dispName) + '</span>' +
      '<span class="mini-amount">₹' + formatCurrency(data.revenue) + '</span>' +
      '<div class="mini-bar-container"><div class="mini-bar" style="width:' + (isInactive ? 0 : pct) + '%;background:' + (isInactive ? '#30363d' : color) + ';"></div></div>' +
      '<span class="mini-percent">' + pct.toFixed(1) + '%</span>' +
      '</div>';
  });

  if (inactiveCount > 0) {
    html += '<div class="mini-inactive-note"><i class="fa fa-exclamation-triangle"></i> ' + inactiveCount + ' inactive with 0 ads</div>';
  }

  return html;
}

function toggleExpandable(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('open');
}

// ============================================================
// CHART HELPERS
// ============================================================
function prepareGraphData(ads) {
  const byDate = {};
  ads.forEach(function(ad) {
    const dt = formatDateForDisplay(ad['To-DTP'] || '');
    if (!dt) return;
    const net = parseInt(ad.Net_Amount, 10) || 0;
    if (net <= 0) return;
    byDate[dt] = (byDate[dt] || 0) + net;
  });
  const dates = Object.keys(byDate).sort(function(a, b) {
    const pa = a.split('-'), pb = b.split('-');
    if (pa.length === 3 && pb.length === 3) {
      return new Date(pa[2], pa[1]-1, pa[0]) - new Date(pb[2], pb[1]-1, pb[0]);
    }
    return a.localeCompare(b);
  });
  let cum = 0;
  const labels = [], cumulative = [], daily = [];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  dates.forEach(function(dt) {
    cum += byDate[dt];
    const p = dt.split('-');
    labels.push(parseInt(p[0]) + ' ' + months[parseInt(p[1])-1]);
    cumulative.push(cum);
    daily.push(byDate[dt]);
  });
  return {
    labels: labels,
    cumulativeData: cumulative,
    dailyData: daily,
    totalRevenue: cum,
    totalAds: ads.filter(function(a){ return a['To-DTP']; }).length,
    dates: dates
  };
}

function createLineChart(canvas, gd, color) {
  if (!canvas) return null;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 220);
  gradient.addColorStop(0, color + '33');
  gradient.addColorStop(1, color + '00');

  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: gd.labels,
      datasets: [{
        label: 'Cumulative Revenue (₹)',
        data: gd.cumulativeData,
        borderColor: color,
        backgroundColor: gradient,
        fill: true,
        tension: 0.3,
        pointBackgroundColor: color,
        pointBorderColor: '#161b22',
        pointBorderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 6,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: true, labels: { color: '#8b949e', font: { size: 10 }, boxWidth: 10, padding: 6 } },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const i = ctx.dataIndex;
              return [
                '📅 ' + gd.dates[i],
                'Daily: ₹' + formatCurrency(gd.dailyData[i] || 0),
                'Cumulative: ₹' + formatCurrency(gd.cumulativeData[i] || 0)
              ];
            }
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          grid: { color: 'rgba(255,255,255,0.06)', drawBorder: false },
          ticks: { color: '#8b949e', font: { size: 10 }, callback: function(v) { return v >= 1000 ? '₹' + (v/1000) + 'K' : '₹' + v; } }
        },
        x: { grid: { display: false }, ticks: { color: '#8b949e', font: { size: 9 }, maxRotation: 45 } }
      },
      animation: { duration: 800, easing: 'easeOutQuart' }
    }
  });
}

// ============================================================
// HEADER CHIPS
// ============================================================
async function updateGlobalHeaderStats() {
  const el = document.getElementById('headerStats');
  if (!el) return;

  if (isICD()) { el.innerHTML = ''; return; }

  el.innerHTML = '<span class="stat-chip"><span class="stat-label">Loading stats…</span></span>';

  try {
    let stats = headerStatsCache;
    if (!stats) {
      const result = await callAPI('getHeaderSummary', {});
      if (!result.success) throw new Error(result.error || 'Failed');
      headerStatsCache = result;
      stats = result;
    }

    const s = stats.summary;
    const scope = stats.scope || {};
    const role = loggedInUser.role;

    let chips = '';
    chips += '<span class="stat-chip"><span class="stat-label">📋 Ads</span><span class="stat-value">' + s.totalAds + '</span></span>';
    chips += '<span class="stat-divider">|</span>';
    chips += '<span class="stat-chip"><span class="stat-label">💰 Total</span><span class="stat-value">₹' + formatCurrency(s.totalRevenue) + '</span></span>';

    const showCity = (role !== 'Auth-Gram');
    const showGram = (role !== 'Auth-City');

    if (showCity) {
      chips += '<span class="stat-divider">|</span>';
      chips += '<span class="stat-chip"><span class="stat-label">🏙️ City</span><span class="stat-value" style="color:#58a6ff;">₹' + formatCurrency(s.cityRevenue) + '</span></span>';
    }
    if (showGram) {
      chips += '<span class="stat-divider">|</span>';
      chips += '<span class="stat-chip"><span class="stat-label">🌾 Gram</span><span class="stat-value" style="color:#3fb950;">₹' + formatCurrency(s.gramRevenue) + '</span></span>';
    }

    const regions = (scope.regions || []);
    if (regions.length === 1) {
      chips += '<span class="stat-divider">|</span>';
      chips += '<span class="stat-chip"><span class="stat-label">📍</span><span class="stat-value">' + escapeHtml(regions[0]) + '</span></span>';
    }

    el.innerHTML = chips;
  } catch (e) {
    el.innerHTML = '<span class="stat-chip"><span class="stat-label">⚠️</span><span class="stat-value">Stats unavailable</span></span>';
  }
}
